<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사이트 올리기 · WA</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css");
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f5f5; color: #222a24; font-family: "SUIT", system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; }
    .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    .brand-mark { width: 42px; height: 42px; border-radius: 12px; background: #426b51; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
    .brand-copy { display: grid; gap: 1px; }
    .brand-copy strong { font-size: 14px; }
    .brand-copy small { color: #858b86; font-size: 11px; }
    .back { color: #4d6555; text-decoration: none; font-size: 14px; font-weight: 650; }
    main { width: min(1120px, calc(100% - 40px)); margin: 24px auto; }
    .panel { min-height: 360px; padding: clamp(32px, 7vw, 72px); border-radius: 24px; background: #e9efe9; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { margin: 0 0 22px; color: #647b69; font-size: 12px; font-weight: 750; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(38px, 7vw, 68px); line-height: 1.12; letter-spacing: -.045em; font-weight: 750; }
    @media (max-width: 600px) { header { padding: 14px 16px; } .brand-mark { width: 38px; height: 38px; } .panel { min-height: 300px; border-radius: 20px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html" aria-label="Website Archive 홈">
      <span class="brand-mark" aria-hidden="true">WA</span>
      <span class="brand-copy"><strong>WA</strong><small>Website Archive</small></span>
    </a>
    <a class="back" href="index.html">← 메인으로</a>
  </header>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <p class="eyebrow">WEB ARCHIVE</p>
      <h1 id="page-title">사이트 올리기</h1>
    </section>
  </main>
</body>
</html>
