<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <title>WA — Website Archive</title>
  <style>@import url("https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css");
    * { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --bg: #f5f5f5;
      --surface: #fff;
      --soft: #eef1ee;
      --text: #27342c;
      --muted: #78847b;
      --line: #e2e6e2;
      --green: #405d48;
      --green-soft: #e9efea;
      --wood: #987b59;
      --shadow: 0 5px 20px #26382d0b;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #171b17;
      --surface: #202720;
      --soft: #273128;
      --text: #eff4ed;
      --muted: #a5b0a5;
      --line: #39443a;
      --green: #a6c4a5;
      --green-soft: #2a382c;
      --wood: #cfb18a;
      --shadow: 0 5px 20px #0003;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "SUIT Variable", "SUIT", "Malgun Gothic", sans-serif;
    }

    button, input { font: inherit; }

    .topbar {
      min-height: 76px;
      padding: 10px max(calc((100vw - 1240px) / 2), 24px);
      display: grid;
      grid-template-columns: minmax(200px, 1fr) minmax(280px, 390px) minmax(200px, 1fr);
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      width: fit-content;
      color: var(--text);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 10px;
      background: var(--green);
      color: #f5f7f3;
    }

    .brand-mark svg { width: 31px; height: 31px; }
    .brand-name { display: grid; gap: 2px; font-size: 17px; font-weight: 800; letter-spacing: -.5px; }
    .brand-name small { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .1px; }

    .top-search {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-self: center;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
    }

    .top-search svg { width: 17px; height: 17px; flex: 0 0 17px; }
    .top-search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; }
    .top-search:focus-within { border-color: #9aab9c; box-shadow: 0 0 0 3px #627b6815; }
    .top-search input::placeholder { color: #929b94; }

    .top-actions { display: flex; justify-self: end; align-items: center; gap: 9px; }
    .write-button {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--green);
      cursor: pointer;
    }

    .page { max-width: 1240px; margin: auto; padding: 28px 24px 70px; }

    .welcome {
      min-height: 318px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      align-items: center;
      gap: 48px;
      margin-bottom: 36px;
      padding: 38px 46px;
      overflow: hidden;
      border: 1px solid #e2e8e1;
      border-radius: 18px;
      background: linear-gradient(118deg, #e8eee9 0%, #f1f2ee 100%);
      box-shadow: var(--shadow);
    }

    .welcome-copy { max-width: 690px; }
    .welcome-label { color: #687b6d; font: 700 11px monospace; letter-spacing: 1.3px; }
    .welcome h1 {  margin: 18px 0 12px; font-size: clamp(30px, 3.2vw, 40px); line-height: 1.35; letter-spacing: -1.6px; }
    .welcome p { max-width: 560px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .welcome-cta { display: inline-flex; align-items: center; gap: 12px; margin-top: 24px; padding: 12px 16px; border-radius: 8px; background: var(--green); color: white; font-size: 13px; font-weight: 700; text-decoration: none; }
    .welcome-cta svg { width: 14px; height: 14px; }

    .welcome-note {
      padding: 24px 22px;
      border: 1px solid #fff9;
      border-radius: 12px;
      background: #ffffffb8;
    }

    .welcome-note h2 { margin: 0 0 16px; font-size: 14px; }
    .welcome-note ul { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .welcome-note li { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .welcome-note li svg { width: 18px; height: 18px; flex: 0 0 18px; color: #718875; }
    .welcome-note p { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e5e9e4; color: #647568; font-size: 12px; }

    .archive-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .archive-head h2 {  margin: 0 0 6px; font-size: 23px; letter-spacing: -.7px; }
    .archive-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .feed-tabs { display: flex; gap: 18px; flex: 0 0 auto; }
    .feed-tabs button { padding: 8px 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
    .feed-tabs button.active { border-color: var(--green); color: var(--green); font-weight: 700; }

    .category-list { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 18px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
    .category {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #56645a;
      font-size: 13px;
      cursor: pointer;
    }
    .category:hover { background: var(--green-soft); }
    .category.active { background: var(--green); color: #fff; }

    .post-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding-top: 22px; }
    .post {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .post:hover { transform: translateY(-2px); border-color: #c4d0c5; box-shadow: 0 9px 24px #26382d12; }
    .post-photo { display: block; width: 100%; height: 205px; object-fit: cover; background: var(--soft); }
    .post-content { padding: 17px 18px 16px; }
    .post-category { margin-bottom: 9px; color: #647b68; font-size: 11px; font-weight: 700; }
    .post h3 {  margin: 0 0 8px; font-size: 18px; line-height: 1.45; letter-spacing: -.45px; }
    .post-desc { min-height: 42px; margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .post-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid #edf0ec; color: var(--muted); font-size: 11px; }
    .post-author { display: flex; align-items: center; gap: 7px; }
    .avatar { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 7px; background: var(--green-soft); color: var(--green); font-size: 10px; font-weight: 700; }
    .post-stats { display: flex; gap: 10px; white-space: nowrap; }
    .rating { color: #8a704a; }
    .empty-state { grid-column: 1 / -1; padding: 56px 20px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

    .overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 20px; background: #18201866; }
    .overlay[hidden] { display: none; }
    .settings { width: min(100%, 400px); padding: 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 15px 55px #17231733; }
    .settings-head, .choices { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
    .settings-head { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .settings-head h2 { margin: 0; font-size: 19px; }
    .close { border: 0; background: transparent; color: var(--muted); font-size: 23px; cursor: pointer; }
    .setting { padding: 16px 0; border-bottom: 1px solid var(--line); }
    .setting h3 { margin: 0 0 5px; font-size: 14px; }
    .setting p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .choice { flex: 1; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; }
    .choice.selected { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .done { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 8px; background: var(--green); color: white; cursor: pointer; }
    .toast { position: fixed; z-index: 8; bottom: 20px; left: 50%; padding: 11px 15px; transform: translateX(-50%); border-radius: 8px; background: var(--text); color: var(--bg); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }

    @media (max-width: 980px) {
      .topbar { grid-template-columns: minmax(170px, 1fr) minmax(240px, 360px) auto; gap: 14px; }
      .page { padding-top: 22px; }
      .welcome { grid-template-columns: minmax(0, 1fr) 225px; gap: 28px; padding: 34px; }
      .post-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      .topbar { min-height: 0; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand actions" "search search"; gap: 10px 12px; padding: 11px 14px 13px; }
      .brand { grid-area: brand; gap: 8px; }
      .brand-mark { width: 40px; height: 40px; flex-basis: 40px; border-radius: 8px; }
      .brand-mark svg { width: 27px; height: 27px; }
      .brand-name { font-size: 15px; }
      .brand-name small { font-size: 10px; }
      .top-search { grid-area: search; padding: 10px 12px; }
      .top-actions { grid-area: actions; gap: 7px; }
      .write-button { padding: 9px 10px; font-size: 12px; }
      .icon-button { width: 38px; height: 38px; }
      .page { padding: 16px 14px 42px; }
      .welcome { min-height: 0; grid-template-columns: 1fr; gap: 23px; margin-bottom: 27px; padding: 25px 22px; border-radius: 14px; }
      .welcome h1 { margin-top: 13px; font-size: clamp(26px, 7vw, 34px); letter-spacing: -1.1px; }
      .welcome p { font-size: 13px; }
      .welcome-cta { margin-top: 18px; }
      .welcome-note { padding: 17px; }
      .welcome-note ul { grid-template-columns: 1fr 1fr; gap: 10px; }
      .welcome-note p { margin-top: 14px; }
      .archive-head { align-items: start; flex-direction: column; gap: 10px; margin-bottom: 13px; }
      .archive-head h2 { font-size: 21px; }
      .feed-tabs { gap: 16px; }
      .category-list { gap: 5px; padding-bottom: 14px; }
      .category { padding: 8px 12px; font-size: 12px; }
      .post-grid { grid-template-columns: 1fr; gap: 14px; padding-top: 15px; }
      .post-photo { height: clamp(185px, 57vw, 260px); }
      .post-content { padding: 15px; }
      .post h3 { font-size: 16px; }
      .post-desc { min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    .topbar {
      position: relative;
      min-height: 108px;
      padding: 0;
      display: block;
      border: 0;
      background: transparent;
    }
    .topbar .brand {
      position: absolute;
      top: 10px;
      left: 12px;
    }
    .topbar .top-actions {
      position: absolute;
      top: 66px;
      left: 15px;
      justify-self: auto;
      gap: 0;
    }
    .welcome { margin-bottom: 18px; }
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 18px auto 36px;
      padding: 0 24px;
    }
    .hero-actions .top-search {
      width: min(390px, 100%);
      max-width: 390px;
      justify-self: auto;
    }

    .hero-actions { width: fit-content; max-width: calc(100% - 24px); }

    @media (max-width: 680px) {
      .topbar { min-height: 98px; }
      .topbar .brand { top: 8px; left: 10px; gap: 8px; }
      .topbar .brand-mark { width: 40px; height: 40px; flex-basis: 40px; border-radius: 8px; }
      .topbar .brand-mark svg { width: 27px; height: 27px; }
      .topbar .brand-name { font-size: 15px; }
      .topbar .brand-name small { font-size: 10px; }
      .topbar .top-actions { top: 56px; left: 11px; }
      .topbar .icon-button { width: 38px; height: 38px; }
      .welcome { margin-bottom: 14px; }
      .hero-actions { width: 100%; flex-direction: column; align-items: stretch; gap: 9px; margin: 14px 0 27px; padding: 0 14px; }
      .hero-actions .top-search { width: 100%; max-width: none; }
      .hero-actions .write-button { width: 100%; padding: 10px 12px; font-size: 13px; }
    }

    .welcome {
  position: relative;
  left: calc(50% + 54px);
  transform: translateX(-50%);
  width: min(1600px, calc(100vw - 148px));
  max-width: none;
  min-height: 460px;
  margin-top: -108px;
}
    @media (max-width: 680px) {
      .welcome {
        left: auto;
        transform: none;
        width: 100%;
        min-height: 0;
        margin-top: 0;
      }
    }

  </style>
</head>
<body>
  <header class="topbar">
  <a class="brand" href="#" aria-label="Website Archive 홈">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 28V8M16 18 8 11M16 21l8-7M16 13l7-7M8 11 5 6M8 11l-1 5M24 14l4-6M24 14l5 2M23 6l-1-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 6c3-1 4 1 3 5-3 0-4-2-3-5Zm18 0c0-3 3-4 5-1-1 3-3 4-5 1Zm1 8c3-2 5 0 5 3-3 1-5 0-5-3Z" fill="currentColor" opacity=".9"/>
      </svg>
    </span>
    <span class="brand-name">WA<small>Website Archive</small></span>
  </a>

  <div class="top-actions">
    <button class="icon-button" id="open-settings" title="설정" aria-label="설정">⚙</button>
  </div>
</header>
  <main class="page">
    <section class="welcome">
      <div class="welcome-copy">
        <div class="welcome-label">WA · WEB ARCHIVE</div>
        <h1 data-ko="만든 사이트 올리고,<br>다른 사람 작업도 구경해요" data-en="Share what you made.<br>See what others are working on.">만든 사이트 올리고,<br>다른 사람 작업도 구경해요</h1>
        <p data-ko="아직 만드는 중이어도 괜찮아요. 주소와 화면 캡처를 올리고, 짧게 소개해주세요." data-en="Still working on it? That's fine. Add a link, a screenshot, and a short note.">아직 만드는 중이어도 괜찮아요. 주소와 화면 캡처를 올리고, 짧게 소개해주세요.</p>
        <a class="welcome-cta" href="#websites">사이트 구경하기 <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
      <aside class="welcome-note">
        <h2>올릴 때 챙길 것</h2>
        <ul>
          <li><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 18V6m0 8-5-4m5 1 5-4M5 10 3 7m10 3 3-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>사이트 주소</li>
          <li><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 18V6m0 8-5-4m5 1 5-4M5 10 3 7m10 3 3-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>화면 캡처</li>
          <li><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 18V6m0 8-5-4m5 1 5-4M5 10 3 7m10 3 3-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>짧은 소개</li>
        </ul>
        <p>완성 전인 작업도 괜찮아요.</p>
      </aside>
    </section>

    <div class="hero-actions">
      <label class="top-search" for="search">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.4" stroke="currentColor" stroke-width="1.6"/><path d="m12.7 12.7 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="제목이나 소개로 검색" autocomplete="off">
      </label>
      <button class="write-button" onclick="window.location.href='create.html'">＋ 내 사이트 올리기</button>
    </div>

    <section id="websites" aria-labelledby="archive-title">
      <div class="archive-head">
        <div>
          <h2 id="archive-title">최근 올라온 사이트</h2>
          <p>만든 사람이 남긴 짧은 메모도 같이 볼 수 있어요.</p>
        </div>
        <div class="feed-tabs" aria-label="정렬 기준">
          <button class="active" data-sort="latest">최신순</button>
          <button data-sort="popular">댓글 많은 순</button>
        </div>
      </div>

      <nav class="category-list" aria-label="카테고리">
        <button class="category active" data-category="전체">전체</button>
        <button class="category" data-category="디자인">디자인</button>
        <button class="category" data-category="게임">게임</button>
        <button class="category" data-category="정보">정보</button>
        <button class="category" data-category="음악">음악</button>
        <button class="category" data-category="기타">기타</button>
      </nav>
      <div class="post-grid" id="posts" aria-live="polite"></div>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden>
    <section class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title" data-ko="표시 설정" data-en="Display settings">표시 설정</h2>
        <button class="close" id="close" aria-label="닫기">×</button>
      </div>
      <div class="setting">
        <h3 data-ko="언어" data-en="Language">언어</h3>
        <p data-ko="화면에 표시할 언어를 선택하세요." data-en="Choose your display language.">화면에 표시할 언어를 선택하세요.</p>
        <div class="choices">
          <button class="choice selected" data-language="ko">한국어</button>
          <button class="choice" data-language="en">English</button>
        </div>
      </div>
      <div class="setting">
        <h3 data-ko="화면 밝기" data-en="Appearance">화면 밝기</h3>
        <p data-ko="밝은 화면과 어두운 화면 중 골라주세요." data-en="Choose between light and dark mode.">밝은 화면과 어두운 화면 중 골라주세요.</p>
        <div class="choices">
          <button class="choice selected" data-theme="light">밝게</button>
          <button class="choice" data-theme="dark">어둡게</button>
        </div>
      </div>
      <button class="done" id="done" data-ko="완료" data-en="Done">완료</button>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const posts = [
      {title:"미니게임 세 개를 만들었어요", category:"게임", author:"moon", time:"오늘", replies:8, rating:"4.8", image:"photo-1550745165-9bc0b252726f", desc:"세 게임을 한 화면에 모았어요. 방향키로 움직이고, 한 판은 짧아요."},
      {title:"동네 책방 찾아오는 길", category:"디자인", author:"sora", time:"어제", replies:5, rating:"4.6", image:"photo-1507842217343-583bb7270b66", desc:"처음 오는 사람도 찾기 쉽도록 입구 사진과 길 안내를 넣었어요."},
      {title:"공부한 날만 체크해요", category:"정보", author:"jun", time:"어제", replies:12, rating:"4.9", image:"photo-1455390582262-044cdead277a", desc:"공부한 날만 달력에 표시돼요. 며칠 빠져도 다시 이어 쓰면 돼요."},
      {title:"출근길에 듣는 곡을 모았어요", category:"음악", author:"haru", time:"이번 주", replies:3, rating:"4.4", image:"photo-1516280440614-37939bbacd81", desc:"출근길에 듣는 곡을 모아뒀어요. 순서는 직접 바꿔 들을 수 있어요."}
    ];

    let activeCategory = "전체";
    let activeSort = "latest";
    const postsArea = document.querySelector("#posts");

    function renderPosts() {
      const query = document.querySelector("#search").value.trim().toLocaleLowerCase();
      let list = posts.filter(post => {
        const categoryMatch = activeCategory === "전체" || post.category === activeCategory;
        const searchable = (post.title + " " + post.desc + " " + post.category + " " + post.author).toLocaleLowerCase();
        return categoryMatch && searchable.includes(query);
      });

      if (activeSort === "popular") list = [...list].sort((a, b) => b.replies - a.replies);
      if (!list.length) {
        postsArea.innerHTML = '<div class="empty-state">검색 결과가 없어요. 제목이나 분야를 바꿔서 찾아보세요.</div>';
        return;
      }

      postsArea.innerHTML = list.map(post =>
        '<article class="post">' +
          '<img class="post-photo" alt="' + post.title + ' 화면 미리보기" loading="lazy" src="https://images.unsplash.com/' + post.image + '?auto=format&fit=crop&w=720&q=82">' +
          '<div class="post-content">' +
            '<div class="post-category">' + post.category + ' · 웹사이트</div>' +
            '<h3>' + post.title + '</h3>' +
            '<p class="post-desc">' + post.desc + '</p>' +
            '<div class="post-meta"><span class="post-author"><span class="avatar" aria-hidden="true">' + post.author.slice(0, 1).toUpperCase() + '</span>' + post.author + ' · ' + post.time + '</span>' +
              '<span class="post-stats"><span>댓글 ' + post.replies + '</span><span class="rating">★ ' + post.rating + '</span></span></div>' +
          '</div>' +
        '</article>'
      ).join("");
    }

    document.querySelector("#search").addEventListener("input", renderPosts);
    document.querySelectorAll(".category").forEach(button => {
      button.onclick = () => {
        activeCategory = button.dataset.category;
        document.querySelectorAll(".category").forEach(item => item.classList.toggle("active", item === button));
        renderPosts();
      };
    });
    document.querySelectorAll("[data-sort]").forEach(button => {
      button.onclick = () => {
        activeSort = button.dataset.sort;
        document.querySelectorAll("[data-sort]").forEach(item => item.classList.toggle("active", item === button));
        renderPosts();
      };
    });

    const overlay = document.querySelector("#overlay");
    document.querySelector("#open-settings").onclick = () => overlay.hidden = false;
    document.querySelector("#close").onclick = () => overlay.hidden = true;
    document.querySelector("#done").onclick = () => overlay.hidden = true;
    overlay.onclick = event => { if (event.target === overlay) overlay.hidden = true; };

    document.querySelectorAll("[data-language]").forEach(button => {
      button.onclick = () => {
        const language = button.dataset.language;
        document.documentElement.lang = language;
        document.querySelectorAll("[data-ko][data-en]").forEach(item => {
          const value = item.dataset[language];
          if (item.matches("h1")) item.innerHTML = value;
          else item.textContent = value;
        });
        document.querySelectorAll("[data-language]").forEach(item => item.classList.toggle("selected", item === button));
      };
    });

    document.querySelectorAll("[data-theme]").forEach(button => {
      button.onclick = () => {
        document.documentElement.dataset.theme = button.dataset.theme;
        document.querySelectorAll("[data-theme]").forEach(item => item.classList.toggle("selected", item === button));
      };
    });

    function message(text) {
      const toast = document.querySelector("#toast");
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    renderPosts();
  </script>
</body>
</html>
