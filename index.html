<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <title>WA — Website Archive</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Website Archive 홈">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 28V8M16 18 8 11M16 21l8-7M16 13l7-7M8 11 5 6M8 11l-1 5M24 14l4-6M24 14l5 2M23 6l-1-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 6c3-1 4 1 3 5-3 0-4-2-3-5Zm18 0c0-3 3-4 5-1-1 3-3 4-5 1Zm1 8c3-2 5 0 5 3-3 1-5 0-5-3Z" fill="currentColor" opacity=".9"/>
        </svg>
      </span>
      <span class="brand-name">WA<small>Website Archive</small></span>
    </a>
    <nav class="top-actions" aria-label="계정 및 화면 모드">
      <div id="guest-actions" class="account-actions">
        <a href="#login" class="text-link">로그인</a>
        <a href="#signup" class="button-secondary">회원가입</a>
      </div>
      <div id="member-actions" class="account-actions" hidden>
        <span id="member-name" class="member-name"></span>
        <button type="button" id="logout" class="button-secondary">로그아웃</button>
      </div>
      <button type="button" class="icon-button" id="theme-toggle" aria-label="다크 모드" aria-pressed="false" title="다크 모드">
        <span aria-hidden="true">☾</span>
      </button>
    </nav>
  </header>

  <main>
    <div class="page" id="home">
      <section class="welcome">
        <div class="welcome-copy">
          <div class="welcome-label">WA · WEB ARCHIVE</div>
          <h1>만든 사이트 올리고,<br>다른 사람 작업도 구경해요</h1>
          <p>아직 만드는 중이어도 괜찮아요. 주소와 화면 캡처를 올리고, 짧게 소개해주세요.</p>
          <a class="welcome-cta" href="#websites">사이트 구경하기 <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
        <aside class="welcome-note">
          <h2>올릴 때 챙길 것</h2>
          <ul>
            <li><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 18V6m0 8-5-4m5 1 5-4M5 10 3 7m10 3 3-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>사이트 주소</li>
            <li><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 18V6m0 8-5-4m5 1 5-4M5 10 3 7m10 3 3-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>화면 캡처 (선택)</li>
            <li><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 18V6m0 8-5-4m5 1 5-4M5 10 3 7m10 3 3-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>짧은 소개</li>
          </ul>
          <p>완성 전인 작업도 괜찮아요.</p>
        </aside>
      </section>

      <div class="hero-actions">
        <label class="top-search" for="search">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.4" stroke="currentColor" stroke-width="1.6"/><path d="m12.7 12.7 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="search" type="search" aria-label="사이트 검색" placeholder="제목이나 소개로 검색" autocomplete="off">
        </label>
        <a class="write-button" href="#create">＋ 내 사이트 올리기</a>
      </div>

      <section id="websites" aria-labelledby="archive-title">
        <div class="archive-head">
          <div>
            <h2 id="archive-title">최근 올라온 사이트</h2>
            <p>만든 사람이 남긴 짧은 메모도 같이 볼 수 있어요.</p>
          </div>
        </div>
        <nav class="category-list" id="categories" aria-label="태그 필터"></nav>
        <div class="post-grid" id="posts" aria-live="polite"></div>
      </section>
    </div>
    <div class="page" id="view" hidden></div>
  </main>

  <template id="auth-template">
    <div class="subpage auth-page">
      <a class="back-link" href="#home">← 메인으로</a>
      <section class="panel" aria-labelledby="auth-title">
        <h1 id="auth-title" tabindex="-1"></h1>
        <p class="muted" id="auth-guide"></p>
        <form id="auth-form" class="fields">
          <label>닉네임
            <input name="nickname" autocomplete="username" required maxlength="24">
          </label>
          <label>비밀번호
            <input name="password" type="password" required>
          </label>
          <p class="form-message" role="status"></p>
          <button type="submit" class="write-button" id="auth-submit"></button>
          <button type="button" class="button-secondary" id="demo-login">예시 계정으로 둘러보기</button>
        </form>
        <a class="text-link auth-switch" id="auth-switch"></a>
      </section>
    </div>
  </template>

  <template id="editor-template">
    <div class="subpage">
      <a class="back-link" id="editor-back" href="#home">← 메인으로</a>
      <section class="panel" aria-labelledby="editor-title">
        <h1 id="editor-title" tabindex="-1"></h1>
        <p class="muted">* 표시가 있는 항목은 꼭 입력해 주세요.</p>
        <form id="site-form" class="fields">
          <label>웹사이트 이름 *
            <input name="title" required maxlength="100" placeholder="예. 미니게임 모음">
          </label>
          <label>웹사이트 주소 *
            <input name="url" type="url" required placeholder="https://example.com">
          </label>
          <label>웹사이트 소개 *
            <textarea name="description" rows="4" required maxlength="1000"></textarea>
          </label>
          <label>웹사이트 태그 *
            <select name="tag" required>
              <option value="">태그를 선택해 주세요</option>
            </select>
          </label>
          <fieldset>
            <legend>AI 사용 여부 *</legend>
            <div class="choices">
              <label><input type="radio" name="aiUsed" value="yes" required> AI 사용</label>
              <label><input type="radio" name="aiUsed" value="no" required> AI 미사용</label>
            </div>
          </fieldset>
          <label>스크린샷 (선택)
            <input name="image" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" aria-describedby="image-help">
          </label>
          <p class="field-help" id="image-help">JPG, PNG, WEBP 중 2MB 이하의 이미지 한 장을 선택할 수 있어요.</p>
          <img id="image-preview" class="image-preview" alt="첨부할 스크린샷 미리보기" hidden>
          <button type="button" class="button-secondary" id="remove-image" hidden>이미지 제거</button>
          <p class="form-message" role="status"></p>
          <div class="form-actions">
            <a class="button-secondary" id="editor-cancel" href="#home">취소</a>
            <button type="submit" class="write-button" id="editor-submit"></button>
          </div>
        </form>
      </section>
    </div>
  </template>

  <template id="detail-template">
    <div class="subpage detail-page">
      <a class="back-link" href="#websites">← 사이트 목록</a>
      <article class="panel" aria-labelledby="detail-title">
        <div class="post-category" id="detail-tag"></div>
        <h1 id="detail-title" tabindex="-1"></h1>
        <div class="detail-meta">
          <span class="post-author" id="detail-author"></span>
          <span class="rating" id="detail-rating"></span>
        </div>
        <div id="detail-image"></div>
        <p class="detail-description" id="detail-description"></p>
        <div class="detail-actions">
          <a class="write-button" id="visit-site" target="_blank" rel="noopener noreferrer">웹사이트 방문 ↗</a>
          <div class="owner-actions" id="owner-actions" hidden>
            <a class="button-secondary" id="edit-site">수정</a>
            <button class="button-secondary danger" type="button" id="delete-site">삭제</button>
          </div>
        </div>
        <p class="form-message" id="detail-message" role="status"></p>
      </article>

      <section class="panel feedback-panel" aria-labelledby="rating-title">
        <h2 id="rating-title">별점</h2>
        <p id="rating-guest" hidden><a class="text-link login-to-detail">로그인하고 별점 남기기</a></p>
        <p class="muted" id="rating-result" hidden></p>
        <form id="rating-form" class="feedback-form" hidden>
          <label for="score" class="muted">전체 별점</label>
          <div class="feedback-actions">
            <select id="score" name="score" required>
              <option value="">1~5점 선택</option>
              <option value="1">1점</option>
              <option value="2">2점</option>
              <option value="3">3점</option>
              <option value="4">4점</option>
              <option value="5">5점</option>
            </select>
            <button class="write-button" type="submit">별점 남기기</button>
          </div>
          <p class="field-help">별점은 한 번만 남길 수 있고 제출 후에는 수정할 수 없어요.</p>
          <p class="form-message" role="status"></p>
        </form>
      </section>

      <section class="panel feedback-panel" aria-labelledby="comments-title">
        <h2 id="comments-title">댓글 <span id="comment-count"></span></h2>
        <ul class="comment-list" id="comments"></ul>
        <p id="comments-guest" hidden><a class="text-link login-to-detail">로그인하고 댓글 남기기</a></p>
        <form id="comment-form" class="feedback-form" hidden>
          <label for="comment" class="muted">댓글 내용</label>
          <textarea id="comment" name="comment" rows="3" required maxlength="500"></textarea>
          <div class="form-actions">
            <button class="write-button" type="submit">댓글 등록</button>
          </div>
        </form>
        <p class="form-message" id="comment-message" role="status"></p>
      </section>
    </div>
  </template>

  <template id="notice-template">
    <div class="subpage">
      <a class="back-link" href="#websites">← 사이트 목록</a>
      <section class="panel" aria-labelledby="notice-title">
        <h1 id="notice-title" tabindex="-1"></h1>
        <p class="muted" id="notice-message"></p>
      </section>
    </div>
  </template>
</body>
</html>
