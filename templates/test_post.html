<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>POST 연습</title>
</head>
<body>
    <h1>웹사이트 등록 연습</h1>

    <form method="POST">
        <label>웹사이트 이름</label>
        <input type="text" name="name" required>

        <br><br>

        <label>웹사이트 주소</label>
        <input type="url" name="url" required>

        <br><br>

        <button type="submit">등록하기</button>
    </form>
</body>
</html>
